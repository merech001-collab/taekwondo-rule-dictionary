<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102a43" />
  <title>태권도 겨루기 경기규칙 전자사전</title>
  <meta name="description" content="2026 태권도 겨루기 경기규칙을 빠르게 검색하고 조항별로 열람하는 전자사전" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TKD</div>
      <div>
        <h1>태권도 겨루기 경기규칙 전자사전</h1>
        <p>2026 경기규칙 · 개정 2025.11.26 · 심판·지도자·선수용</p>
      </div>
    </div>
    <button id="favoritesToggle" class="ghost-btn" type="button">☆ 즐겨찾기</button>
  </header>

  <main class="container">
    <section class="hero">
      <span class="sample-badge official-badge">2026 공식 경기규칙 PDF 기반</span>
      <h2>찾고 싶은 경기규칙을 검색하세요</h2>
      <p>예: 감점 · 넘어짐 · 한계선 · 영상판독 · 머리 공격 · 계체 · 골든라운드</p>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="규정, 상황, 키워드 검색" autocomplete="off" />
        <button id="searchButton" class="primary-btn" type="button">검색</button>
      </div>
      <div id="recentSearches" class="recent" aria-live="polite"></div>
    </section>

    <section class="category-section" aria-label="주제별 분류">
      <div id="categoryChips" class="chips"></div>
    </section>

    <section class="content-grid">
      <aside class="toc-card">
        <div class="section-heading">
          <h3>조항별 목차</h3>
          <button id="clearFilters" class="text-btn" type="button">전체보기</button>
        </div>
        <nav id="tocList" class="toc-list" aria-label="규칙 목차"></nav>
      </aside>

      <section class="results-card">
        <div class="section-heading">
          <div>
            <h3 id="resultsTitle">전체 조항</h3>
            <p id="resultsCount" class="muted"></p>
          </div>
        </div>
        <div id="resultsList" class="results-list"></div>
      </section>

      <article id="detailPanel" class="detail-card" aria-live="polite"></article>
    </section>
  </main>

  <footer class="footer">
    <p>자료 기준: 「2026 태권도 겨루기 경기규칙」. PDF 텍스트 추출 과정에서 표·줄바꿈은 원본과 다르게 보일 수 있으므로 중요한 판정은 원본 PDF와 함께 확인하세요.</p>
  </footer>

  <script src="data/rules-1.js"></script>
  <script src="data/rules-2.js"></script>
  <script src="data/rules-3.js"></script>
  <script src="data/rules-4.js"></script>
  <script src="data/rules-5.js"></script>
  <script src="app.js"></script>
</body>
</html>
