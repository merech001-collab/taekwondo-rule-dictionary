<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102a43" />
  <title>태권도 경기규칙 전자사전</title>
  <meta name="description" content="태권도 경기규칙을 빠르게 검색하고 해설과 판정 사례를 함께 보는 전자사전 시제품" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TKD</div>
      <div>
        <h1>태권도 경기규칙 전자사전</h1>
        <p>심판 · 지도자 · 선수 · 대학생을 위한 빠른 규칙 검색</p>
      </div>
    </div>
    <button id="favoritesToggle" class="ghost-btn" type="button">★ 즐겨찾기</button>
  </header>

  <main class="container">
    <section class="hero">
      <span class="sample-badge">1차 시제품 · 샘플 데이터</span>
      <h2>찾고 싶은 경기규칙을 검색하세요</h2>
      <p>예: 감점 · 머리 공격 · 비디오판독 · 전자호구 · 경계선 · 넘어짐</p>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="규정, 상황, 키워드 검색" autocomplete="off" />
        <button id="searchButton" class="primary-btn" type="button">검색</button>
      </div>

      <div id="recentSearches" class="recent" aria-live="polite"></div>
    </section>

    <section class="category-section" aria-label="주제별 분류">
      <div id="categoryChips" class="chips"></div>
    </section>

    <section class="content-grid">
      <aside class="toc-card">
        <div class="section-heading">
          <h3>조항별 목차</h3>
          <button id="clearFilters" class="text-btn" type="button">전체보기</button>
        </div>
        <nav id="tocList" class="toc-list" aria-label="규칙 목차"></nav>
      </aside>

      <section class="results-card">
        <div class="section-heading">
          <div>
            <h3 id="resultsTitle">전체 규정</h3>
            <p id="resultsCount" class="muted"></p>
          </div>
        </div>
        <div id="resultsList" class="results-list"></div>
      </section>

      <article id="detailPanel" class="detail-card" aria-live="polite">
        <div class="empty-state">
          <strong>규정을 선택하세요</strong>
          <span>목차나 검색 결과를 누르면 상세 내용을 확인할 수 있습니다.</span>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <p>※ 현재 내용은 기능 확인을 위한 샘플입니다. 실제 대한태권도협회 경기규칙 원문은 공식 자료 입력 후 교체할 예정입니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
